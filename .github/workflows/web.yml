name: Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node design/generate-tokens.mjs
      - run: pnpm --filter @plug/web lint
      - run: pnpm --filter @plug/web exec tsc --noEmit
      - run: pnpm --filter @plug/web build
      - run: pnpm --filter @plug/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @plug/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
