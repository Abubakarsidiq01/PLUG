name: Windows onboarding check
# Runs the literal commands from docs/onboarding/windows.md on a real Windows
# runner, so Person Two's setup is caught and fixed here rather than being the
# first place it's discovered. Not a substitute for her actually running
# through it once herself (manual.docx P0.S1-two) — this validates the
# commands work on real Windows infrastructure, not the interactive parts
# (Docker Desktop's install wizard, WSL2 setup, trusting prompts).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Windows onboarding
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked Bruno CLI (docs/onboarding/windows.md step 3)
        run: npm ci --prefix tools/bruno --ignore-scripts --no-audit --no-fund

      - name: Check Bruno dependency compatibility and audit
        run: |
          node --test tools/bruno/compatibility.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Bruno dependency compatibility checks failed" }
          npm audit --prefix tools/bruno --audit-level high
          if ($LASTEXITCODE -ne 0) { throw "Bruno dependency audit failed" }

      - name: Web install + build (steps 4-5)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @plug/web build

      - name: Playwright (step 5)
        # web/playwright.config.ts's mobile/tablet projects use device presets
        # backed by webkit, not chromium — both are needed, matching web.yml.
        run: |
          pnpm --filter @plug/web exec playwright install --with-deps chromium webkit
          pnpm --filter @plug/web test:e2e

      # No Docker/Postgres step here: GitHub's hosted windows-latest runners run
      # Docker in Windows-container mode with no WSL2/Hyper-V Linux VM backend,
      # so a Linux image like postgis/postgis cannot be pulled at all here
      # ("no matching manifest for linux/amd64" — confirmed on a real run, not
      # a config mistake). This is a hosted-CI-only limitation: on Person Two's
      # actual machine, real Docker Desktop uses WSL2 and this works fine — see
      # docs/onboarding/windows.md step 6, which she still needs to prove
      # herself for exactly this reason (P0.S1-two's real acceptance criterion).
      #
      # The backend itself needs no database to start — DataSourceAutoConfiguration
      # is excluded outside the db Spring profile — so gradlew.bat, bootRun and
      # the Bruno collection can still be validated here without Docker.
      - name: Start backend and run Bruno (steps 6-7, no database profile)
        working-directory: backend
        # Keep Gradle's parent shell alive until Bruno finishes. Across separate
        # Windows steps the backend answered the startup probe, then disappeared
        # before Bruno connected. Match the explicit IPv4 bind as well.
        run: |
          $backendProcess = Start-Process -FilePath ".\gradlew.bat" `
            -ArgumentList "bootRun", "--console=plain" `
            -RedirectStandardOutput "..\bootrun.log" `
            -RedirectStandardError "..\bootrun-err.log" `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(120)
            do {
              if ($backendProcess.HasExited) { throw "Backend process exited before becoming healthy" }
              Start-Sleep -Seconds 3
              try { $r = Invoke-WebRequest -Uri http://127.0.0.1:8080/health -UseBasicParsing -TimeoutSec 3 } catch { $r = $null }
            } until ($r.StatusCode -eq 200 -or (Get-Date) -gt $deadline)
            if ($r.StatusCode -ne 200) { throw "Backend did not become healthy within 120s" }
            Push-Location ..\tests\api
            try {
              & "../../tools/bruno/node_modules/.bin/bru.cmd" run --env local --reporter-json ../../bruno-results.json
              if ($LASTEXITCODE -ne 0) { throw "Bruno collection failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            if (-not $backendProcess.HasExited) {
              & taskkill.exe /PID $backendProcess.Id /T /F | Out-Null
            }
          }

      - name: Show backend diagnostics after a failure
        if: failure()
        run: |
          Get-Content bootrun.log, bootrun-err.log -ErrorAction SilentlyContinue
          Get-Content bruno-results.json -ErrorAction SilentlyContinue

      - name: Confirm PROJECT_STATE.json is readable (step 8)
        run: |
          Get-Content PROJECT_STATE.json | ConvertFrom-Json |
            Select-Object current_phase, current_step, owner

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-backend-log
          path: |
            bootrun.log
            bootrun-err.log
            bruno-results.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-playwright-report
          path: web/playwright-report/
