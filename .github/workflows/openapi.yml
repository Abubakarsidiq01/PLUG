name: OpenAPI
on:
  pull_request:
    paths: ["contracts/**", ".github/workflows/openapi.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/openapi.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx --yes @stoplight/spectral-cli@6.15.0 lint contracts/openapi.yaml --fail-severity warn
