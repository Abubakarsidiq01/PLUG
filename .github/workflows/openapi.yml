name: OpenAPI
on:
  pull_request:
  push:
    branches: [main]
# No path filter: a required status check that never starts on a given PR blocks
# that PR forever under branch protection. Simpler to always run at this repo size.
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @stoplight/spectral-cli@6.15.0 lint contracts/openapi.yaml --fail-severity warn
