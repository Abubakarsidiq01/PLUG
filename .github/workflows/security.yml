name: Security
on:
  pull_request:
  push:
    branches: [main, setup]
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    # manual.docx P0.S9 / gate G0: "CI runs at least dependency, secret, and
    # build-and-test checks." Dependabot covers dependency scanning; this is
    # the secret-scanning check. GitHub's own secret scanning + push protection
    # is a repository setting (Settings > Code security), not a workflow — this
    # step is the part that's actually expressible as code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # codeql-action reads its own workflow run in a private repository.
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@v6
      - run: cd backend && ./gradlew classes --no-daemon
      # Code scanning upload needs paid GitHub Code Security on a private repository
      # (owner decision 2026-11-15: no). The SARIF is kept as an artifact and any
      # result fails the job, so the gate still holds.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
      - name: Fail on any CodeQL result
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL results: $count"
          if [ "$count" -ne 0 ]; then
            jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/*.sarif
            exit 1
          fi
