name: Security
on:
  pull_request:
  push:
    branches: [main, setup]
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    # manual.docx P0.S9 / gate G0: "CI runs at least dependency, secret, and
    # build-and-test checks." Dependabot covers dependency scanning; this is
    # the secret-scanning check. GitHub's own secret scanning + push protection
    # is a repository setting (Settings > Code security), not a workflow — this
    # step is the part that's actually expressible as code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@v4
      - run: cd backend && ./gradlew classes --no-daemon
      - uses: github/codeql-action/analyze@v4
