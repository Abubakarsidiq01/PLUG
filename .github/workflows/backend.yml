name: Backend
on:
  pull_request:
  push:
    branches: [main]
# No path filter: a required status check that never starts on a given PR blocks
# that PR forever under branch protection. Simpler to always run at this repo size.
permissions:
  contents: read
jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: plug
          POSTGRES_USER: plug
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U plug -d plug" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PLUG_DATABASE_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - run: ./gradlew test databaseTest build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/
