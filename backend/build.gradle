plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.plug'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

springBoot {
    buildInfo {
        properties {
            // GET /health reports this so the connected checkpoint can tell staging apart
            // from local without leaking configuration. CI sets GIT_COMMIT; local defaults to "dev".
            additional = ['commit': (providers.environmentVariable('GIT_COMMIT').getOrElse('dev'))]
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    // Intent extraction only (ADR-009). Output is untrusted and validated by IntentAdapter.
    implementation 'com.anthropic:anthropic-java:2.34.0'
    // contracts/skills.yaml is read at startup (manual v4 §19A.2).
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.networknt:json-schema-validator:1.5.9'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
}

tasks.named('test') { useJUnitPlatform { excludeTags 'database' } }

tasks.register('databaseTest', Test) {
    description = 'Validates migrations and PostGIS against a real PostgreSQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'database' }
    shouldRunAfter tasks.named('test')
}

checkstyle {
    toolVersion = '10.26.1'
}

// The phase gate names this task explicitly; contract examples and runtime responses
// share the same OpenAPI-backed validator. Database contracts also run in databaseTest.
tasks.register('contractTest', Test) {
    description = 'Checks OpenAPI contracts and shared response fixtures.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'database' }
    filter { includeTestsMatching '*ContractTest' }
}

// The skill vocabulary is a contract artefact (contracts/skills.yaml). Ship that exact file
// inside the application so runtime and contract cannot drift.
tasks.named('processResources') {
    from('../contracts') {
        include 'skills.yaml'
        into 'contracts'
    }
}

