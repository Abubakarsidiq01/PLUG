spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  application:
    name: plug-api
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
server:
  address: ${PLUG_BIND_ADDRESS:127.0.0.1}
  max-http-request-header-size: 8KB
  shutdown: graceful
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 200
    accept-count: 50
    connection-timeout: 5s
    max-swallow-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
plug:
  environment: ${PLUG_ENVIRONMENT:local}
  requests-per-minute: 60
