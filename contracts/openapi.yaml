openapi: 3.1.0
info:
  title: PLUG API
  version: 0.4.0
  description: >
    Phase 0, Phase 1 and Phase 2 contract shared by the PLUG iOS app and the modular-monolith backend.
    Source of truth for method, route, auth, request, response, enums and errors
    (manual.docx §18.1). Changes require one pull request in /contracts with BOTH
    approvals, updated fixtures and an entry in CHANGELOG.md.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api-staging.plug.app
    description: Staging
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Public. Deliberately says almost nothing.
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness. Not public — kept off the internet at the infra/WAF layer. Used by the load balancer.
      responses:
        '200':
          description: Ready to receive traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '503':
          description: Not ready. A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /v1/requests:
    post:
      operationId: createRequest
      summary: Create a service request from the person's own words
      description: >
        Phase 2 (manual.docx §18.3, §27.3). `text` is required; every structured field is
        optional. A structured value the client sends is authoritative and is validated
        exactly like any other input. A value the client omits is extracted from `text` by
        the intent adapter, whose output is untrusted and is schema-validated and
        range-checked before it is persisted (§19.5). Anything still missing takes the safe
        default named on RequestConstraints. A model timeout or invalid model output never
        produces an error: the server falls back to deterministic extraction.


        Any lawful service is accepted (ADR-009): shoe repair, plumbing, tutoring, a barber.
        Only a missing service blocks execution, so it is the only thing PLUG ever asks
        about, and it asks at most once per request (§27.3 ClarificationPolicy). When it
        must ask, the 201 response has status `draft`, next_action `answer_clarification`
        and a `clarification`. Location is never asked: the client sends it, from the device
        or from an address the person typed, so the permission-denied path still works.


        A service no participating supplier covers is not an error: the request ends
        expired with no_result_reason no_coverage, and the iOS app may search Apple Maps on
        the device with constraints.search_terms to list real nearby businesses whose price
        and availability it shows as Unknown. Those listings are not offers and nobody is
        contacted. A prohibited request is refused with 422 restricted_intent; it
        creates no outreach, writes an audit event, and the response names no rule and
        carries no created request resource identifier. error.request_id is still the
        correlation ID required by the shared error envelope.


        Caller must hold the guest or member scope and have accepted the current consent
        version, otherwise 403 forbidden with `details[0].code` = consent_required. Rate
        limits: 10 creations per minute per account and 30 per minute per caller address.
        Bodies over 16 KB are 413 before parsing.
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequestBody' }
      responses:
        '201':
          description: >
            Created. The body is the server's canonical state. Replaying the same
            Idempotency-Key with the same body returns this response again, unchanged, and
            creates nothing.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/RestrictedIntent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      operationId: getRequest
      summary: The caller's own request — status, next_action and real progress
      description: >
        The polling route. `status`, `next_action` and `progress` come only from the server;
        the client never infers state from elapsed time and never advances progress between
        polls. While next_action is `wait_for_offers` the response carries
        `poll_after_seconds`, and the client waits that long before asking again.


        Ownership is checked against the database on every read. A request that does not
        exist, or belongs to someone else, is 404 — never 403 — so an identifier cannot be
        confirmed by probing.
      security:
        - plugSession: []
      responses:
        '200':
          description: The request.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/requests/{request_id}/clarifications:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      operationId: answerClarification
      summary: Answer the one clarifying question on a draft request
      description: >
        Accepted only while the request is `draft` with next_action `answer_clarification`,
        and only for the clarification_id the server issued. `value` must be one of that
        clarification's option values. A successful answer moves the request to
        `submitted`; no second question is ever asked.


        A retry with the same Idempotency-Key and body returns the original response. Any
        other answer once the request has left `draft` (answered, canceled or expired) is
        409 conflict with `details[0]` = { field: clarification_id, code:
        not_awaiting_clarification }. A value outside the options is 400 with code
        not_an_option. Someone else's request is 404.
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClarificationAnswer' }
      responses:
        '200':
          description: Answered. The request's new canonical state.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestStateConflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/requests/{request_id}/offers:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      operationId: listOffers
      summary: Validated offers for the caller's own request, ranked by the server
      description: >
        Only structured, validated offers are returned. Price, availability and the truth
        label are set by the server; the client renders them and never computes, re-labels
        or re-sorts them. An offer whose expires_at has passed is not returned.


        A request that has no offers yet — including one still in `draft` or
        `awaiting_responses` — returns 200 with an empty list; the client follows
        next_action on GET /v1/requests/{request_id}, not the length of this list. At most
        20 offers; there is no pagination, because fan-out is bounded. Someone else's
        request is 404.
      security:
        - plugSession: []
      responses:
        '200':
          description: The offers, best first.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/requests/{request_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      operationId: cancelRequest
      summary: Cancel the caller's own request, at any point, idempotently
      description: >
        Always available while the request is live, including mid-flight (§11.5). The
        transition takes a row lock, so a cancel racing a worker either lands first or sees
        the worker's result; it never leaves a half-applied state, and no outreach starts
        after a cancel commits.


        Cancelling a request that is already `canceled` returns 200 with the same body, so a
        retry after a dropped connection is safe without an Idempotency-Key. Cancelling one
        that is `expired`, `completed` or `blocked` is 409 conflict with `details[0]` =
        { field: request_id, code: not_cancelable }. Someone else's request is 404.
      security:
        - plugSession: []
      responses:
        '200':
          description: Canceled. status is `canceled` and next_action is `none`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestStateConflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange an Apple identity token for a PLUG session
      description: >
        The client sends the identity token Sign in with Apple returned on the device.
        The server verifies the signature against Apple's published keys and checks the
        issuer, audience, expiry and nonce before it trusts anything in the token. A token
        that has already been exchanged is refused, so a captured token cannot be replayed.

        Sending a guest access token in the Authorization header upgrades that guest
        account in place: the user_id does not change, so a request the guest started
        stays attached to the same person after signing in.
      security:
        - plugSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleSignIn' }
      responses:
        '201':
          description: Signed in. A new session was issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange an Google identity token for a PLUG session
      description: >
        The client sends the identity token Sign in with Google returned on the device.
        The server verifies the signature against Google's published keys and checks the
        issuer, audience, expiry and nonce before it trusts anything in the token. A token
        that has already been exchanged is refused, so a captured token cannot be replayed.

        Sending a guest access token in the Authorization header upgrades that guest
        account in place: the user_id does not change, so a request the guest started
        stays attached to the same person after signing in.
      security:
        - plugSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignIn' }
      responses:
        '201':
          description: Signed in. A new session was issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/phone/start:
    post:
      operationId: startPhoneVerification
      summary: Begin phone verification and send a one-time code
      description: >
        Returns a challenge the caller verifies with POST /v1/auth/phone/verify. The
        response is identical whether or not the number is already known to PLUG, so
        this endpoint cannot be used to discover who has an account.

        Three independent limits apply: per phone number, per caller address and, on
        verification, per challenge. The response never says which limit was reached.

        Twilio SMS delivery is enabled only when explicitly configured;
        environments without a delivery channel return 503 dependency_unavailable
        rather than pretending a message was sent.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStart' }
      responses:
        '202':
          description: A code was sent if the number can receive one.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChallenge' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/phone/verify:
    post:
      operationId: verifyPhoneCode
      summary: Exchange a verified phone code for a PLUG session
      description: >
        A wrong or expired code is a validation_failed carrying details[0].field = "code"
        and details[0].code = "invalid" or "expired". The client branches on that token
        and never on the message. Running out of attempts is a rate_limited response with
        retry_after_seconds, because the control that stopped the caller is a limit.

        Sending a guest access token in the Authorization header upgrades that guest
        account in place, exactly as the Apple route does.
      security:
        - plugSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerify' }
      responses:
        '201':
          description: Verified. A new session was issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/guest:
    post:
      operationId: signInAsGuest
      summary: Create a guest account and session
      description: >
        A guest is a real account with a real user_id, so the work a guest starts survives
        an upgrade to Apple or phone. It carries the guest scope only, and its refresh
        window is shorter than a verified account's.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSignIn' }
      responses:
        '201':
          description: A guest account and session were created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      description: >
        Every refresh rotates: the token sent here is spent and a new one comes back.
        Presenting a token that was already rotated means the material leaked, so the
        whole chain is revoked and the caller must sign in again.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: A rotated session.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the calling session server-side
      description: >
        Revocation happens on the server, which is what makes "I logged out" true. The
        access token and the whole refresh chain stop working immediately. Calling this
        with an already revoked token still returns 204, so a client that retries after a
        dropped connection does not see an error for work that is already done.
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '204':
          description: The session is revoked.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me:
    get:
      operationId: getMe
      summary: The calling account and its consent state
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's own account.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me/consent:
    post:
      operationId: acceptConsent
      summary: Record acceptance of a published consent version
      description: >
        Called when the published consent version moves ahead of the version the account
        accepted. Each acceptance is stored with its version and an audit event, so support
        can answer "which terms did this person agree to, and when" without a database client.
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAcceptance' }
      responses:
        '200':
          description: The acceptance was recorded.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me/sessions:
    get:
      operationId: listOwnSessions
      summary: The caller's own live sessions
      description: >
        Requires the member scope. A guest is refused with 403 forbidden: its identity is
        a single device credential, so there is no second session for it to manage, and
        POST /v1/auth/logout already ends the one it has.
      security:
        - plugSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Live sessions belonging to the caller, newest first.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: session_id
        required: true
        schema: { type: string, maxLength: 64, pattern: '^ses_[A-Za-z0-9-]+$' }
    get:
      operationId: getOwnSession
      summary: One of the caller's own sessions
      description: >
        Ownership is checked on the server for every read. A session that belongs to
        someone else returns 404, not 403, because 403 would confirm that the identifier
        names a real session and identifiers must stay unguessable in both directions.
      security:
        - plugSession: []
      responses:
        '200':
          description: The session.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: revokeOwnSession
      summary: Revoke one of the caller's own sessions
      description: >
        Signing out a lost device. Revoking a session the caller does not own returns 404,
        for the same reason the read does.
      security:
        - plugSession: []
      responses:
        '204':
          description: The session is revoked.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestIdResponseHeader' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    stagingJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Phase 0 only. Staging issuer, audience, expiry and plug.requests.write scope are
        validated; local loopback development is exempt. No Phase 2 operation uses it; the
        backend keeps it on the Phase 0 stub until requests_v2 replaces that stub.
    plugSession:
      type: http
      scheme: bearer
      description: >
        An opaque PLUG access token from POST /v1/auth/*. It is not a JWT and carries no
        claims: the server looks the session up on every request, which is what lets logout
        and a security-sensitive change revoke it the instant they happen rather than when
        an expiry eventually catches up (manual.docx 25.2).
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-Id
      required: false
      schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      description: >
        Client-generated correlation ID. Echoed back on the response and carried into
        both lanes' structured logs so the connected checkpoint can find one request
        in both places. The server generates one if absent or invalid (manual.docx §19.2).
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      description: >
        Client-generated, stable across every retry of the same logical action (a UUID
        works). Stored per account with a hash of the body: the same key and body return the
        original response unchanged; the same key with a different body is 409 conflict with
        details[0].code = idempotency_key_reused; a duplicate arriving while the first is
        still running is 409 with request_in_progress. Missing or malformed is 400 with
        details[0].field = Idempotency-Key. Keys are kept for 24 hours (manual.docx §19.2).
    RequestIdPath:
      in: path
      name: request_id
      required: true
      schema: { type: string, maxLength: 64, pattern: '^req_[A-Za-z0-9-]+$' }
      description: >
        Opaque. Logged as the route template, never as the value. A well-formed identifier
        the caller does not own is 404; a malformed one is also 404, so the two cannot be
        told apart.
  headers:
    RequestIdResponseHeader:
      description: The correlation ID for this request — either the caller's or a server-generated one.
      schema: { type: string }
  responses:
    ValidationFailed:
      description: The request was malformed or out of range.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: Missing or invalid staging access token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Access token lacks the required write scope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: The identity is already attached to a different account.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such resource, or it does not belong to the caller.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: >
        conflict. details[0] = { field: Idempotency-Key, code: idempotency_key_reused |
        request_in_progress }.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RequestStateConflict:
      description: >
        conflict. The request is not in a state that allows this action, or the
        Idempotency-Key was reused. details[0].code is one of not_awaiting_clarification,
        not_cancelable, idempotency_key_reused, request_in_progress. The client reloads
        GET /v1/requests/{request_id} and follows its next_action.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RestrictedIntent:
      description: >
        restricted_intent. Understood but refused by policy. No outreach, an audit event
        written, no rule identifier and no created request resource identifier in the
        body. error.request_id is the correlation ID, not a persisted request resource.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    DependencyUnavailable:
      description: A dependency this route needs is not available.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests; retry_after_seconds names the wait
      headers:
        Retry-After:
          schema: { type: string }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Unexpected internal failure; no internal details are exposed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, const: UP }
        version: { type: string, example: "0.1.0" }
        commit: { type: string, example: "a91f3c2" }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        checks:
          type: object
          additionalProperties: false
          properties:
            database: { type: string, enum: [UP, DOWN, DISABLED] }
            migrations: { type: string, enum: [UP, DOWN, DISABLED] }
    Phase0RequestCreate:
      deprecated: true
      description: >
        The Phase 0 stub body (frozen@0.1.0). Not part of the Phase 2 contract. Kept only so
        the stub the backend still serves stays checkable until the P2 implementation
        replaces it behind the requests_v2 flag; removed in that pull request.
      type: object
      additionalProperties: false
      required: [query, location]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        location: { $ref: '#/components/schemas/Phase0Location' }
    Phase0Location:
      deprecated: true
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Phase0RequestResponse:
      deprecated: true
      description: The Phase 0 stub's 202 body. Removed with Phase0RequestCreate.
      type: object
      additionalProperties: false
      required: [request_id, status, next_action]
      properties:
        request_id: { type: string, pattern: '^req_[A-Za-z0-9-]+$' }
        status: { type: string, enum: [RECEIVED] }
        next_action: { type: string, enum: [PROCESSING] }
    CreateRequestBody:
      description: >
        What the person asked for. Only `text` and `location` are required. A structured
        field, when present, is authoritative over whatever is extracted from `text`.
      type: object
      additionalProperties: false
      required: [text, location]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The person's own words. Must contain a non-whitespace character; control
            characters other than newline are rejected. Never written to a log.
          example: "I need to repair my shoe for $45 tomorrow"
        category: { $ref: '#/components/schemas/Category' }
        budget_cents:
          type: integer
          minimum: 500
          maximum: 500000
          description: Upper price limit in integer cents, $5.00–$5,000.00. Requires currency.
        currency: { $ref: '#/components/schemas/Currency' }
        needed_by:
          type: string
          format: date-time
          description: >
            ISO-8601 with an explicit offset. Must be later than now (in_the_past) and no
            more than 7 days ahead (too_far_ahead).
        max_distance_m:
          type: integer
          minimum: 100
          maximum: 50000
        location: { $ref: '#/components/schemas/RequestLocation' }
        time_zone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_+/-]+$'
          example: America/Chicago
          description: >
            The person's IANA time zone, so "tomorrow" or "tonight" mean their day. An
            unknown zone is 400 with code invalid. Absent means UTC.
    RequestLocation:
      description: >
        Where to search from. Sent by the client from the device or from an address the
        person typed and the device geocoded. The server stores and returns it rounded to
        its precision — coarse to 3 decimal places (about 110 m), fine to 4 (about 11 m) —
        and never writes coordinates to a log.
      type: object
      additionalProperties: false
      required: [latitude, longitude, precision]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        precision: { type: string, enum: [coarse, fine] }
    Category:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,39}$'
      example: shoe_repair
      description: >
        A free-form service identifier in snake_case (ADR-009) — barber, nail_salon,
        shoe_repair, plumber. Clients must not assume a closed list; display service_name.
        Participating-supplier coverage exists only for some categories (seeded barber and
        beauty in Phase 2).
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217. V1 accepts USD only; any other code is 400 with code unsupported.
      example: USD
    RequestResource:
      description: >
        The canonical request. Clients render it and navigate on next_action; they never
        compute status, progress, labels or prices themselves.
      type: object
      additionalProperties: false
      required: [request_id, status, next_action, text, constraints, progress, created_at, updated_at, expires_at]
      properties:
        request_id: { type: string, pattern: '^req_[A-Za-z0-9-]+$' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        next_action: { $ref: '#/components/schemas/NextAction' }
        text:
          type: string
          maxLength: 500
          description: The person's own words, returned only to the owner.
        constraints: { $ref: '#/components/schemas/RequestConstraints' }
        progress: { $ref: '#/components/schemas/RequestProgress' }
        clarification:
          $ref: '#/components/schemas/Clarification'
          description: Present if and only if next_action is answer_clarification.
        no_result_reason:
          $ref: '#/components/schemas/NoResultReason'
          description: Present if and only if next_action is show_no_result.
        poll_after_seconds:
          type: integer
          minimum: 1
          maximum: 30
          description: >
            Present if and only if next_action is wait_for_offers. How long to wait before
            the next GET. It is a polling interval, not an estimate of when offers arrive,
            and must never be shown as one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: >
            When the request stops collecting offers, or, in draft, when an unanswered
            clarification lapses. After it the server moves the request to expired.
    RequestConstraints:
      description: >
        The constraints the server will execute, after explicit values, validated
        extraction and defaults are combined. A null is a stated default, not a missing
        value: the client shows "Any price" or "As soon as possible", never a guess.
      type: object
      additionalProperties: false
      required: [category, service_name, search_terms, budget_cents, currency, needed_by,
                 max_distance_m, location]
      properties:
        service_name:
          oneOf:
            - { type: string, minLength: 1, maxLength: 80 }
            - { type: 'null' }
          description: >
            Human-readable service ("Shoe repair"), safe to display. Null exactly when
            category is null.
        search_terms:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 60 }
          description: >
            Server-validated phrases a client may use to search a maps provider for nearby
            businesses ("shoe repair", "cobbler"). Empty exactly when category is null.
        category:
          oneOf:
            - { $ref: '#/components/schemas/Category' }
            - { type: 'null' }
          description: >
            Null while status is draft awaiting the category clarification, and remains
            null if that unanswered draft is canceled or expires with
            no_result_reason clarification_unanswered. Never invent a category to close
            an unanswered request. All other states require a concrete category.
        budget_cents:
          oneOf:
            - { type: integer, minimum: 500, maximum: 500000 }
            - { type: 'null' }
          description: Null means no budget filter.
        currency: { $ref: '#/components/schemas/Currency' }
        needed_by:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
          description: Null means as soon as possible.
        max_distance_m:
          type: integer
          minimum: 100
          maximum: 50000
          description: Always concrete. When not stated, the zone default.
        location: { $ref: '#/components/schemas/RequestLocation' }
    RequestProgress:
      description: >
        Real counts from the server (manual.docx §11.5). They change only when the server
        does work; the client never interpolates them or animates them against time.
        Invariants: replied <= contacted and offers_ready <= replied. In Phase 2 the suppliers
        counted are seeded suppliers and no message leaves PLUG; Phase 3 keeps the same
        fields for real outreach.
      type: object
      additionalProperties: false
      required: [contacted, replied, offers_ready]
      properties:
        contacted: { type: integer, minimum: 0, maximum: 50 }
        replied: { type: integer, minimum: 0, maximum: 50 }
        offers_ready: { type: integer, minimum: 0, maximum: 20 }
    RequestStatus:
      type: string
      enum: [draft, submitted, routed, awaiting_responses, ranked, user_selected,
             confirmed, completed, expired, canceled, blocked]
      description: >
        Server-owned state (manual.docx §19.6). Legal transitions, enforced under a row lock:
        draft -> submitted | expired | canceled;
        submitted -> routed | blocked | canceled;
        routed -> awaiting_responses | expired | canceled;
        awaiting_responses -> ranked | expired | canceled;
        ranked -> user_selected | expired | canceled;
        user_selected -> confirmed | expired | canceled;
        confirmed -> completed | canceled;
        completed, expired, canceled and blocked are terminal.
        confirmed is reachable only from a supplier event — never a timer, an admin or a
        client. Phase 2 reaches draft through ranked plus expired, canceled and blocked;
        user_selected, confirmed and completed are declared now so Phase 3 adds no value.
        A blocked request is refused with 422 at creation and is never returned to a client.
    NextAction:
      type: string
      enum: [answer_clarification, wait_for_offers, choose_offer,
             await_supplier_confirmation, show_result, show_no_result, none]
      description: >
        What the client shows next. Authoritative; the client never derives it from status
        or from elapsed time. The server emits exactly:
        draft -> answer_clarification;
        submitted, routed, awaiting_responses -> wait_for_offers;
        ranked -> choose_offer;
        user_selected -> await_supplier_confirmation;
        confirmed, completed -> show_result;
        expired -> show_no_result;
        canceled -> none.
    NoResultReason:
      type: string
      enum: [no_coverage, no_offers, clarification_unanswered]
      description: >
        Why there is nothing to show, so the empty state can say why and offer one action.
        no_coverage — no eligible supplier is within max_distance_m for the category;
        no_offers — suppliers were contacted but no valid offer arrived, or every offer
        expired; clarification_unanswered — the draft lapsed before the question was answered.
    Clarification:
      description: >
        The one question PLUG may ask. Structured options only; there is no free-text answer.
        `question` and option labels are server copy, safe to display, and never contain
        model reasoning.
      type: object
      additionalProperties: false
      required: [clarification_id, field, question, options]
      properties:
        clarification_id: { type: string, maxLength: 64, pattern: '^cla_[A-Za-z0-9-]+$' }
        field:
          type: string
          enum: [category]
          description: The constraint the answer fills. Only category blocks execution.
        question: { type: string, minLength: 1, maxLength: 200 }
        options:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/ClarificationOption' }
    ClarificationOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_]+$' }
        label: { type: string, minLength: 1, maxLength: 80 }
    ClarificationAnswer:
      type: object
      additionalProperties: false
      required: [clarification_id, value]
      properties:
        clarification_id: { type: string, maxLength: 64, pattern: '^cla_[A-Za-z0-9-]+$' }
        value: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_]+$' }
    OfferList:
      type: object
      additionalProperties: false
      required: [request_id, offers]
      properties:
        request_id: { type: string, pattern: '^req_[A-Za-z0-9-]+$' }
        offers:
          type: array
          maxItems: 20
          description: Ranked by the server, best first. The client does not re-sort.
          items: { $ref: '#/components/schemas/Offer' }
    Offer:
      description: >
        A validated offer. Every value here came from a supplier record or reply that passed
        server validation; none is generated by a model or filled in by a client. An offer
        that cannot carry a real price and a real time does not exist.
      type: object
      additionalProperties: false
      required: [offer_id, place, service_name, price_cents, currency, available_at,
                 expires_at, observed_at, truth_label, source]
      properties:
        offer_id: { type: string, maxLength: 64, pattern: '^off_[A-Za-z0-9-]+$' }
        place: { $ref: '#/components/schemas/Place' }
        service_name: { type: string, minLength: 1, maxLength: 80 }
        price_cents: { type: integer, minimum: 500, maximum: 50000 }
        currency: { $ref: '#/components/schemas/Currency' }
        available_at:
          type: string
          format: date-time
          description: When the slot starts.
        expires_at:
          type: string
          format: date-time
          description: When the offer stops being valid. Always later than available_at.
        observed_at:
          type: string
          format: date-time
          description: When the evidence behind price and availability was captured.
        truth_label: { $ref: '#/components/schemas/TruthLabel' }
        source: { $ref: '#/components/schemas/OfferSource' }
    Place:
      type: object
      additionalProperties: false
      required: [place_id, name, address, distance_m]
      properties:
        place_id: { type: string, maxLength: 64, pattern: '^plc_[A-Za-z0-9-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 200 }
        distance_m:
          type: integer
          minimum: 0
          maximum: 50000
          description: Straight-line metres from the request location, computed server-side.
    TruthLabel:
      type: string
      enum: [confirmed, recent, estimated, unknown]
      description: >
        Set by the server only, from the evidence source and observed_at (manual.docx §11.2).
        confirmed and recent require supplier or scout verification inside their window, so
        a `seed` offer is never confirmed or recent. Clients render the label they were
        sent; they never compute it and never upgrade it as time passes.
    OfferSource:
      type: string
      enum: [seed, sms, portal]
      description: >
        seed — synthetic Phase 2 supplier data, labelled estimated at best; sms and portal —
        Phase 3 supplier replies, declared now so Phase 3 adds no value.
    AppleSignIn:
      type: object
      additionalProperties: false
      required: [identity_token, nonce, consent_version]
      properties:
        identity_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: The identity token from ASAuthorizationAppleIDCredential. Never logged.
        nonce:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: >
            The raw nonce whose SHA-256 the client sent to Apple. The server hashes it and
            compares it to the token's nonce claim, which is what ties the token to this
            device's sign-in attempt rather than to any token Apple ever issued.
        consent_version: { $ref: '#/components/schemas/ConsentVersion' }
        intent: { $ref: '#/components/schemas/AuthIntent' }
    GoogleSignIn:
      type: object
      additionalProperties: false
      required: [identity_token, nonce, consent_version]
      properties:
        identity_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: The identity token from GIDSignInResult.user.idToken. Never logged.
        nonce:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: >
            The raw nonce sent to the Google SDK. It must match the signed token nonce exactly.
        consent_version: { $ref: '#/components/schemas/ConsentVersion' }
        intent: { $ref: '#/components/schemas/AuthIntent' }
    PhoneStart:
      type: object
      additionalProperties: false
      required: [phone_number]
      properties:
        phone_number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: E.164, including the country code. Stored as a hash, never logged.
    PhoneChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, attempts_remaining]
      properties:
        challenge_id: { type: string, pattern: '^cha_[A-Za-z0-9-]+$' }
        expires_at: { type: string, format: date-time }
        attempts_remaining: { type: integer, minimum: 0, maximum: 5 }
    PhoneVerify:
      type: object
      additionalProperties: false
      required: [challenge_id, code, consent_version]
      properties:
        challenge_id: { type: string, pattern: '^cha_[A-Za-z0-9-]+$' }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The six digits from the message. Never logged, in any form.
        consent_version: { $ref: '#/components/schemas/ConsentVersion' }
        intent: { $ref: '#/components/schemas/AuthIntent' }
    AuthIntent:
      type: string
      enum: [sign_up, sign_in]
      description: >
        sign_up refuses an existing verified provider identity (409 conflict, detail code
        account_exists); sign_in refuses an unknown verified identity (account_not_found).
        These checks run only after provider token or OTP verification. Omission preserves
        the combined flow for older clients. Email strings never link different providers.
    GuestSignIn:
      type: object
      additionalProperties: false
      required: [consent_version]
      properties:
        consent_version: { $ref: '#/components/schemas/ConsentVersion' }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1, maxLength: 512 }
    ConsentAcceptance:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/ConsentVersion' }
    ConsentVersion:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      example: "2026-09-01"
      description: >
        The publication date of the Terms and Privacy Policy the person accepted. The
        client sends the version it actually displayed, and the server rejects a version
        it has never published rather than recording an agreement to unknown text.
    Session:
      description: >
        Issued by every sign-in route and by refresh. Both tokens are opaque and both are
        stored only in the iOS Keychain (manual.docx 20.2). Access tokens live 15 minutes;
        a refresh token lives 30 days for a verified account and 7 days for a guest.
      type: object
      additionalProperties: false
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, account, consent]
      properties:
        access_token: { type: string, minLength: 1, maxLength: 512 }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, minLength: 1, maxLength: 512 }
        refresh_token_expires_at: { type: string, format: date-time }
        account: { $ref: '#/components/schemas/Account' }
        consent: { $ref: '#/components/schemas/Consent' }
    Account:
      type: object
      additionalProperties: false
      required: [user_id, type, scopes]
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9-]+$'
          description: >
            Stable for the life of the account, including across a guest upgrade. Phase 2
            and everything after it use this identifier; there is no second client identity.
        type: { type: string, enum: [guest, phone, apple, google] }
        scopes:
          type: array
          description: What this session may do. A guest holds guest only.
          items: { type: string, enum: [guest, member, admin] }
    Consent:
      type: object
      additionalProperties: false
      required: [current_version, accepted_version]
      properties:
        current_version: { $ref: '#/components/schemas/ConsentVersion' }
        accepted_version:
          oneOf:
            - { $ref: '#/components/schemas/ConsentVersion' }
            - { type: 'null' }
          description: >
            Null only in the moment before a first acceptance. When it trails
            current_version the client must show the consent screen again.
        accepted_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    Me:
      type: object
      additionalProperties: false
      required: [account, consent]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        consent: { $ref: '#/components/schemas/Consent' }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, created_at, last_used_at, expires_at, current]
      properties:
        session_id: { type: string, pattern: '^ses_[A-Za-z0-9-]+$' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current:
          type: boolean
          description: True for the session making this call, so the client can label it.
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SessionSummary' }
    Error:
      description: The error envelope. Every non-2xx response has exactly this shape (manual.docx §18.2).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable and machine-readable. Clients branch on this, never on the message.
              enum: [validation_failed, unauthenticated, forbidden, not_found, conflict,
                     rate_limited, restricted_intent, dependency_unavailable, internal_error]
            message:
              type: string
              description: Human-readable and safe to display. Never contains internal identifiers, stack traces, SQL or provider error text.
            request_id: { type: string, example: req_01H8XK4Q7N }
            details:
              type: array
              description: >
                Field-level problems on validation_failed. A route may also document a
                branching token here on conflict or forbidden (for example
                idempotency_key_reused, not_cancelable, consent_required); clients branch on
                details[].code rather than on a new top-level code.
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
            retry_after_seconds:
              type: integer
              description: Present on rate_limited and dependency_unavailable.
