# contracts/skills.yaml — the controlled skill vocabulary (manual v4 §12B.3, §19A.2).
# Owned by Person Two, changed by pull request with both approvals, like any contract.
# The model maps free text onto these tags. It never creates one. An unmatched term is
# surfaced to the person and recorded as a vocabulary gap; it is never matched on.
#
# Rules
#  1. A new tag is a pull request with both approvals, plus a migration that inserts it
#     into skill_vocabulary (the backend refuses to start if the two disagree).
#  2. Removing a tag requires a migration for providers who hold it.
#  3. A tag that needs a licence carries `requires_licence: true` and is matched only
#     against providers who have supplied one.
#  4. Tags are snake_case, 2-40 characters. Synonyms are lowercase phrases.
#
# Deliberately absent until a safety policy exists for them: childcare, elder care,
# medical, legal and financial advice. Asks for those are refused, not guessed.

